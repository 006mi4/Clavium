name: Bug report
description: Something in Clavium does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. Please do not paste passwords, private keys, tokens or the
        addresses of servers you do not want to make public. A security problem does not belong here:
        see [SECURITY.md](https://github.com/006mi4/Clavium/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what Clavium did instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it again
      placeholder: |
        1. Open a terminal on a host
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Clavium version
      description: Shown in the settings of Clavium.
      placeholder: 0.1.14
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Your computer
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      multiple: true
      options:
        - Terminal
        - Suggestions in the terminal
        - Workspaces and split view
        - File manager (SFTP)
        - File manager (FTP or FTPS)
        - Text editor
        - Screens
        - Docker
        - AI access (MCP)
        - Vault, keys or known hosts
        - Updates or installation
        - Something else
  - type: input
    id: server
    attributes:
      label: The server
      description: Operating system and, if you know it, the SSH or FTP server and the shell. No address needed.
      placeholder: Ubuntu 24.04, OpenSSH 9.6, zsh
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: A screenshot of the Clavium window helps. Check first that it shows nothing private.
