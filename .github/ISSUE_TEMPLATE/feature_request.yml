name: Idea
description: Something Clavium should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task itself, not the solution yet. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How Clavium could help
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Your computer
      multiple: true
      options:
        - Windows
        - macOS
        - Linux (not supported yet)
  - type: checkboxes
    id: help
    attributes:
      label: Taking part
      options:
        - label: I would like to build this myself and open a pull request
