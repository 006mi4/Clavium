name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Unit & integration tests (incl. stdio bridge)
        run: npm test
      - name: End-to-end tests (real Electron app)
        run: npx vitest run -c vitest.e2e.config.mts
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
