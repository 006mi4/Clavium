name: Release

# Push a tag like v0.1.0 (must match "version" in package.json) to build and publish
# the Windows installer and portable exe as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release
  id-token: write # build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check tag matches package.json version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG does not match package.json version $v" }

      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx electron-builder --win --publish never

      - name: SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Where-Object { $_.Name -match '^Clavium-(Setup-)?[\d.]+(-portable)?\.exe$' } |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      # Lets users verify that a download was built by this workflow from this repository:
      #   gh attestation verify Clavium-Setup-x.y.z.exe --repo 006mi4/Clavium
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/Clavium-Setup-*.exe
            dist/Clavium-*-portable.exe

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Clavium-Setup-*.exe
            dist/Clavium-*-portable.exe
            dist/SHA256SUMS.txt
