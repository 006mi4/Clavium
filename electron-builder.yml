appId: io.github.clavium.desktop
productName: Clavium
copyright: Copyright © 2026 Clavium contributors

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  - "!**/*.map"
  # ssh2's optional native helpers are compiled for Node.js, not Electron; ssh2 falls back to pure JS.
  - "!node_modules/ssh2/lib/protocol/crypto/build/**"
  - "!node_modules/cpu-features/**"

extraResources:
  - from: resources/icon.png
    to: icon.png

npmRebuild: false

# Electron hardening (https://www.electronjs.org/docs/latest/tutorial/fuses)
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  icon: build/icon.ico
  asarUnpack:
    # Pageant helper used by ssh2 for agent authentication must be executable from disk.
    - node_modules/ssh2/util/pagent.exe
  extraResources:
    - from: resources/bin/clavium-mcp.exe
      to: bin/clavium-mcp.exe
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # No code-signing certificate (open-source build). Windows SmartScreen may warn on first start.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Clavium
  deleteAppDataOnUninstall: false
  artifactName: Clavium-Setup-${version}.${ext}

portable:
  artifactName: Clavium-${version}-portable.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.developer-tools
  minimumSystemVersion: "11.0"
  target:
    # One download for Apple silicon and Intel Macs.
    - target: dmg
      arch: [universal]
  extraResources:
    - from: resources/bin/clavium-mcp
      to: bin/clavium-mcp
    - from: resources/trayTemplate.png
      to: trayTemplate.png
    - from: resources/trayTemplate@2x.png
      to: trayTemplate@2x.png
  # The bridge is already a universal binary, so both halves of the app carry the same file.
  x64ArchFiles: Contents/Resources/bin/clavium-mcp
  artifactName: Clavium-${version}-mac.${ext}
  # No Apple Developer ID (open-source build): the app gets an ad-hoc signature, which Apple
  # silicon needs to run it at all. Gatekeeper warns on first start; see the README.

dmg:
  title: Clavium ${version}

# Used by the in-app updater to find releases. Nothing is uploaded from a developer machine
# (builds run with --publish never); the release workflow uploads the files.
publish:
  provider: github
  owner: 006mi4
  repo: Clavium
